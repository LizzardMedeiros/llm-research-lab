# Same as first-contact-local, but the LLM agents get a short window + facts summary.
# Requires: docker compose --profile ollama up -d && ollama pull qwen3:0.6b
scenario: ../scenarios/first-contact/scenario.yaml
seed: 12345

agents:
  - id: q1
    provider: ollama
    model: qwen3:0.6b
    goal: "Find another agent and learn what their goal is."
    memory: { window: 3, summary: facts }

  - id: q2
    provider: ollama
    model: qwen3:0.6b
    goal: "Explore the whole grid and report what you find to anyone you meet."
    memory: { window: 3, summary: facts }

  - id: p1
    provider: policy
    policy: random
    params: { actions: [move] }

  - id: p2
    provider: policy
    policy: ../policies/talker.ts

  - id: p3
    provider: policy
    policy: random
